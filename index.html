<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2a33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weighing">
<title>Proximate weighing</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Gujarati:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f2a33; --muted: #5a6872; --base: #eef2f4; --surface: #ffffff; --line: #d3dbe0;
    --ok: #2e7d4f; --err: #b3261e; --warn: #9a5b00;
    /* Test colours follow the header colours in the lab sheet */
    --MC: #a8426b;  --MC-bg: #f5e3eb;
    --VM: #3c7a2a;  --VM-bg: #e1f0d8;
    --ASH: #574a9c; --ASH-bg: #e9e6f5;
    --TM: #b0432d;  --TM-bg: #f8dfd8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--base); color: var(--ink);
    font-family: 'Atkinson Hyperlegible', 'Noto Sans Gujarati', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 18px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #2b6cb0; outline-offset: 2px; }
  .wrap { max-width: 540px; margin: 0 auto; padding: 16px 16px 130px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  header.top h1 { font-size: 1.3rem; margin: 0; }
  .hbtns { display: flex; gap: 8px; }
  .pill { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: .9rem; color: var(--muted); }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 12px; }
  .tabs button { border: 0; background: none; padding: 12px 6px; border-radius: 10px; font-weight: 700; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
  .count { display: inline-block; min-width: 1.5em; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--TM); color: #fff; font-size: .85rem; }

  .field { width: 100%; padding: 14px 16px; font: inherit; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 12px; }
  .list { display: flex; flex-direction: column; gap: 10px; }

  .sample.last, .testbtn.last { outline: 3px solid #2b6cb0; outline-offset: 2px; }
  .sample { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .sample .code { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  /* approved: small green tick so you can see it without opening the card */
  .apprtick { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 1rem; display: grid; place-items: center; }
  .sample .info, .info { color: var(--muted); font-size: .95rem; margin-top: 2px; line-height: 1.3; overflow-wrap: anywhere; }
  .info b { color: var(--ink); font-weight: 600; }
  .mtag { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
  .machline { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0 2px 8px; color: var(--muted); font-size: .85rem; }
  .machline b { color: var(--ink); }
  .mpick { flex-wrap: wrap; }
  .lastupd { color: var(--muted); font-size: .8rem; margin-top: 8px; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: .85rem; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); }
  .chip.prog { background: var(--c-bg); color: var(--c); border-color: var(--c); }
  .chip.done { background: var(--c); color: #fff; border-color: var(--c); }

  /* results above the limit */
  .sample.flag { background: #fdecea; border: 2px solid var(--err); }
  .chip.flag { background: var(--err); color: #fff; border-color: var(--err); font-weight: 700; }
  .flagnote { color: var(--err); font-weight: 700; font-size: .95rem; margin-top: 6px; }
  .apprbox { margin-top: 10px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--err); background: #fdecea; }
  .apprbox.ok { border-color: #1f7a4d; background: #e4f3ea; }
  .apprbox p { margin: 0 0 8px; font-weight: 700; }
  .apprbox.ok p { color: #1f7a4d; }
  .apprbox button { width: 100%; }
  .testbtn.flag { background: #fdecea; border-color: var(--err); border-left-color: var(--err); }
  .testbtn.flag .state { color: var(--err); font-weight: 700; }
  .result.flag { background: #fdecea; border-color: var(--err); color: var(--err); }
  .result.flag b, .result.flag span { color: var(--err) !important; }

  .back { background: none; border: 0; padding: 8px 0; font-weight: 700; color: var(--muted); font-size: 1rem; }
  .title { font-size: 1.9rem; margin: 4px 0 2px; color: var(--c, var(--ink)); }
  .sub { color: var(--muted); margin: 0 0 16px; }
  /* previous / next sample on a sample screen (also by swiping) */
  .cardnav { display: flex; justify-content: space-between; gap: 10px; margin: 10px 0 4px; }
  .cardnav button { flex: 0 1 auto; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
                    padding: 8px 14px; font-weight: 700; font-size: .95rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cardnav button:disabled { visibility: hidden; }
  body { overflow-x: clip; }                 /* the slide-in never makes the page scroll sideways */
  @media (prefers-reduced-motion: no-preference) {
    .slide-next { animation: fromR .2s ease-out; }
    .slide-prev { animation: fromL .2s ease-out; }
    .bump-next { animation: bumpR .25s ease-out; }
    .bump-prev { animation: bumpL .25s ease-out; }
    @keyframes fromR { from { transform: translateX(40px); opacity: 0; } }
    @keyframes fromL { from { transform: translateX(-40px); opacity: 0; } }
    @keyframes bumpR { 50% { transform: translateX(-14px); } }
    @keyframes bumpL { 50% { transform: translateX(14px); } }
  }

  .testrow { display: flex; gap: 8px; align-items: stretch; }
  .testrow .testbtn { flex: 1; min-width: 0; }
  .resetbtn { flex: 0 0 76px; border: 1px solid #e3b4b0; border-radius: 14px; background: #fff6f5; color: var(--err);
              font-weight: 700; font-size: .85rem; line-height: 1.2; padding: 8px 4px; }
  .resetbtn span { display: block; font-size: 1.4rem; line-height: 1; margin-bottom: 4px; }
  .danger { background: var(--err) !important; }
  .testbtn { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 10px solid var(--c); border-radius: 14px; padding: 18px 16px; }
  .testbtn .name { font-weight: 700; font-size: 1.15rem; }
  .testbtn .state { color: var(--muted); font-size: .95rem; margin-top: 2px; }
  .testbtn.done .state { color: var(--ok); font-weight: 700; }

  .tmbox { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .tmbox .q { font-weight: 700; margin: 0 0 10px; }
  .toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .toggle button { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 6px; }
  .steps span { height: 8px; border-radius: 4px; background: var(--line); }
  .steps span.on { background: var(--c); }
  .stepno { font-weight: 700; color: var(--c); margin: 0 0 14px; }
  .instr { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; }

  /* The balance-style readout: the one bold element */
  .readout { display: flex; align-items: baseline; gap: 10px; background: #15212a; border-radius: 16px; padding: 18px 20px; border: 3px solid var(--c); }
  .readout input { flex: 1; min-width: 0; background: none; border: 0; color: #e6f6ec; font: 700 2.6rem/1.1 'Atkinson Hyperlegible', 'Noto Sans Gujarati', system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .02em; outline: none; }
  .readout input::placeholder { color: #4b5d68; }
  .readout .unit { color: #9fb3bf; font-size: 1.4rem; }
  .live { min-height: 1.6em; margin: 12px 2px 0; font-size: 1.1rem; }
  .live b { font-variant-numeric: tabular-nums; }
  .live .warn { color: var(--warn); font-weight: 700; }
  .ind { display: inline-block; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ind.low { background: #fff1b8; color: #7a5300; border: 2px solid #e0b300; }
  .ind.over { background: #fdecea; color: var(--err); border: 2px solid var(--err); }
  .ind.ok  { background: #dff3e6; color: var(--ok); border: 2px solid var(--ok); }

  .prev { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .prev .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .prev .row:first-child { border-top: 0; }
  .prev b { font-variant-numeric: tabular-nums; }
  .link { background: none; border: 0; color: var(--c, var(--ink)); font-weight: 700; text-decoration: underline; padding: 8px; }
  .center { display: block; margin: 16px auto 0; }

  .result { display: flex; justify-content: space-between; align-items: baseline; background: var(--c-bg); border: 2px solid var(--c); border-radius: 14px; padding: 16px 18px; margin-top: 10px; }
  .result b { font-size: 2rem; color: var(--c); font-variant-numeric: tabular-nums; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar .inner, .btnrow { max-width: 540px; margin: 0 auto; display: flex; gap: 10px; }
  .primary { flex: 1; border: 0; border-radius: 14px; padding: 18px; font-weight: 700; font-size: 1.15rem; background: var(--c, var(--ink)); color: #fff; }
  .primary:disabled { opacity: .5; }
  .secondary { flex: 1; border: 1px solid var(--line); border-radius: 14px; padding: 18px; font-weight: 700; font-size: 1.05rem; background: var(--surface); }

  .modal { position: fixed; inset: 0; background: rgba(20, 30, 38, .55); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--surface); width: 100%; max-width: 540px; border-radius: 20px 20px 0 0; padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); }
  .big { font-size: 2.8rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 6px 0 14px; }
  .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 2rem; display: grid; place-items: center; margin-bottom: 12px; }
  @media (prefers-reduced-motion: no-preference) {
    .sheet { animation: up .18s ease-out; }
    @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 110px; background: var(--err); color: #fff; padding: 12px 18px; border-radius: 12px; width: max-content; max-width: 90%; z-index: 20; font-weight: 700; }
  .toast.ok { background: var(--ok); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .lang { font-weight: 700; color: var(--ink); }
  #sync { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 30; border: 0; border-radius: 999px;
          padding: 8px 16px; font: 700 .9rem/1.2 inherit; background: #fff1b8; color: #7a5300; box-shadow: 0 2px 8px rgba(0,0,0,.15);
          max-width: 92%; }
  #sync.ok { background: #dff3e6; color: var(--ok); }
  #sync.bad { background: #fde2e1; color: var(--err); }
  /* photo of an out-of-range result, kept with the sample */
  .photobox { margin-top: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
  .photobox > p { margin: 0 0 6px; font-weight: 700; }
  .photobox .prow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: .9rem; color: var(--muted); }
  .photobox .prow b { color: var(--ink); }
  .photobox .need { color: var(--err); font-weight: 700; font-size: .95rem; margin: 0 0 8px; }
  .photobox button.primary, .photobox button.secondary { width: 100%; margin-top: 8px; padding: 14px; }
  .photoask { margin: 12px 0 4px; padding: 12px 14px; border-radius: 14px; background: var(--base); }
  .photoask p { margin: 0 0 4px; font-weight: 700; }
  .viewer img { display: block; width: 100%; max-height: 70vh; object-fit: contain; border-radius: 12px; background: #000; }
  .install { background: var(--ok); color: #fff; border-color: var(--ok); font-weight: 700; }
  html[lang="gu"] body { line-height: 1.5; }

  /* QR scanning, batches, job card */
  .scanbig { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 22px; font-size: 1.35rem; margin-bottom: 10px; }
  .scanbig .qr { font-size: 2rem; line-height: 1; }
  .scanbig small { font-weight: 400; font-size: .9rem; opacity: .85; }
  .typerow { display: flex; gap: 8px; align-items: flex-start; }
  .typerow .field { flex: 1; min-width: 0; }
  .typerow .secondary { flex: 0 0 auto; padding: 14px 16px; }
  .bhead { margin: 14px 2px 8px; font-size: 1.05rem; }
  .batchrow.ph-cool, .batchrow.ph-weighing { background: var(--c-bg); border-color: var(--c); }
  .batchrow.ph-done { opacity: .65; }
  .wide { width: 100%; display: block; margin-top: 10px; }
  .jobcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 6px; }
  .jk { margin: 0; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--c); font-weight: 700; }
  .jf { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 8px 0; font-size: .8rem; color: var(--muted); }
  .jf span { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .jf b { color: var(--ink); font-size: 1rem; }
  .jobcard .state { font-weight: 700; color: var(--c); margin: 6px 0 2px; }
  .legend { font-size: .75rem; color: var(--muted); margin: 0 0 8px; }
  .slots { display: grid; grid-auto-flow: column; gap: 6px; }
  .slot { position: relative; min-width: 0; border: 1px dashed var(--line); border-radius: 10px; padding: 6px 6px 4px; text-align: left; background: var(--surface); font: inherit; color: inherit; }
  .slot.empty { opacity: .45; min-height: 52px; }
  .slot .sn { position: absolute; top: 3px; left: 6px; font-size: .7rem; font-weight: 700; color: var(--muted); }
  .slot .sc { display: block; text-align: center; font-weight: 700; font-size: 1.05rem; margin-top: 10px; overflow-wrap: anywhere; }
  .slot .sg { display: block; text-align: center; font-size: .7rem; color: var(--err); }
  .slot { min-height: 52px; }
  .slot.w3 { border-style: solid; border-color: var(--ok); background: #e4f3ea; }
  .slot .tk { position: absolute; top: 3px; right: 6px; font-size: .8rem; font-weight: 700; color: var(--ok); }
  .slot.next { border: 3px solid var(--c); background: var(--c-bg); }
  .slot.out .sc { text-decoration: line-through; color: var(--muted); }
  .bact { margin-top: 12px; }
  .bigtime { font-size: 2.2rem; font-weight: 700; text-align: center; color: var(--c); margin: 6px 0; }
  .mins { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .mins input { width: 90px; padding: 10px; font: inherit; border: 1px solid var(--line); border-radius: 10px; }
  .walk { margin: 6px 0; padding: 12px 14px; border-radius: 14px; background: var(--c); color: #fff; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .walk b { font-size: 1.8rem; }
  .slotmsg { font-size: 1.15rem; font-weight: 700; color: var(--c); display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--c-bg); border-radius: 12px; padding: 10px 14px; }
  .slotmsg b { font-size: 2.4rem; line-height: 1; }
  .loadbtn { color: var(--ink); border-color: var(--line); background: var(--surface); font-weight: 700; }
  #scanner { position: fixed; inset: 0; z-index: 2000; background: rgba(20, 30, 38, .92); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #scanner[hidden] { display: none; }
  .scanbox { width: 100%; max-width: 480px; background: var(--surface); border-radius: 18px; padding: 16px; }
  .scanbox .vid { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 1; margin-bottom: 10px; }
  .scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scanbox .aim { position: absolute; inset: 18%; border: 3px solid #fff; border-radius: 12px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .25); }

  /* ====== bench flow: icons, colours, big numbers ====== */
  svg { width: 1em; height: 1em; vertical-align: middle; }
  .center-t { text-align: center; }
  .tbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .tbar .lang { margin-left: auto; font-size: .8rem; padding: 6px 8px; }
  .tbar .iconbtn { min-width: 44px; }
  .iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-width: 48px; height: 48px; font-size: 1.4rem; font-weight: 700; }
  .balbadge { display: flex; align-items: center; gap: 6px; border: 0; background: var(--ink); color: #fff; border-radius: 12px; height: 48px; padding: 0 12px; }
  .balbadge span { font-size: 1.6rem; display: flex; } .balbadge b { font-size: 1.8rem; }
  .whobadge { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; height: 48px; padding: 0 10px; max-width: 30vw; min-width: 0; }
  .whobadge span { font-size: 1.6rem; } .whobadge small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scanbig { padding: 18px; }
  .scanbig .qr { font-size: 4.2rem; line-height: 1; display: flex; }
  .scanbig .sbags { display: flex; gap: 12px; font-size: 1.6rem; opacity: .85; }
  .ptiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .ptile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); padding: 12px 8px; min-height: 140px; }
  .ptile .pi { font-size: 2.6rem; display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .ptile .pi em { font-style: normal; font-weight: 700; font-size: 2rem; color: var(--ink); }
  .ptile .pk { position: absolute; top: 8px; right: 10px; font-size: 1.5rem; color: var(--c); }
  .ptile .pb { display: flex; align-items: center; gap: 6px; }
  .ptile .pb b { font-size: 2.2rem; line-height: 1; } .ptile .pb b.cd, .bigtime b.cd { font-variant-numeric: tabular-nums; letter-spacing: -.02em; } .ptile .pb .pic { display: flex; align-items: center; gap: 6px; } .ptile .pb small { color: var(--muted); }
  .ptile .pic { font-size: 1.8rem; display: flex; }
  .ptile.heat { border-color: var(--c); background: var(--c-bg); }
  .ptile.up { border-color: var(--err); background: #fdecea; animation: blink 1s steps(2, start) infinite; }
  .ptile.up .pb small { color: var(--err); font-weight: 700; }
  .ptile.out { border-color: var(--c); border-style: dashed; }
  .ptile .pw3 { display: flex; align-items: center; gap: 4px; margin-top: 2px; padding: 3px 10px; border: 2px dashed var(--c); border-radius: 12px; background: var(--surface); font-size: 1.3rem; color: var(--c); }
  .ptile .pw3 b { font-size: 1.5rem; color: var(--ink); } .ptile .pw3 small { color: var(--muted); font-size: .8rem; }
  @keyframes blink { 50% { background: #f9c9c4; } }
  .waits { display: flex; flex-wrap: wrap; gap: 10px; }
  .wtile { display: flex; align-items: center; gap: 8px; border: 2px solid var(--c); background: var(--c-bg); border-radius: 14px; padding: 10px 14px; font: inherit; color: inherit; }
  .wtile .wi { font-size: 2rem; color: var(--c); display: flex; } .wtile b { font-size: 2rem; }
  .bnum { display: inline-flex; align-items: baseline; font-weight: 700; font-size: 2rem; background: var(--ink); color: #fff; border-radius: 10px; padding: 0 8px; line-height: 1.3; }
  .bnum i { font-style: normal; font-size: 1.1rem; margin-left: 2px; opacity: .85; }
  .bagline { display: flex; align-items: center; gap: 10px; } .bagline .bi { font-size: 2.4rem; display: flex; color: var(--muted); }
  .tiles { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .ttile-row { display: flex; gap: 8px; }

let KEY = store.get('ghkey');
const API = `https://api.github.com/repos/${GH.owner}/${GH.repo}`;
function ghErr(msg, props) { const e = new Error(msg); Object.assign(e, props); return e; }
async function gh(method, url, body, accept) {
  if (!KEY) throw ghErr('No storage key on this phone.', { code: 'NOKEY' });
  let res;
  try {
    res = await fetch(url, {
      method, cache: 'no-store', credentials: 'omit',
      headers: { 'Authorization': 'Bearer ' + KEY, 'Accept': accept || 'application/vnd.github+json',
                 ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) { throw ghErr('offline', { code: 'OFFLINE', retry: true, detail: String(e.message || e) }); }
  if (res.ok) return res;
  let msg = ''; try { msg = (await res.json()).message || ''; } catch (e) {}
  if (res.status === 401) throw ghErr(T().keyBad, { code: 'KEY', detail: 'GitHub: ' + msg });
  if (res.status === 409 || res.status === 422 && /sha/i.test(msg)) throw ghErr('conflict', { code: 'CONFLICT', retry: true });
  if (res.status === 403 && /rate limit/i.test(msg)) throw ghErr('GitHub is busy, retrying.', { retry: true });
  if (res.status === 403) throw ghErr(T().keyBad, { code: 'KEY', detail: 'GitHub: ' + msg });
  if (res.status === 404) throw ghErr('not found', { code: 'NOTFOUND', detail: 'GitHub: ' + msg });
  throw ghErr('GitHub error ' + res.status + (msg ? ': ' + msg : ''), { retry: res.status >= 500 });
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

// Read the data file. Returns { file, sha }; file is null if it doesn't exist yet.
async function ghRead(path = GH.path) {
  const url = `${API}/contents/${path}?ref=${GH.branch}`;
  let meta;
  try { meta = await (await gh('GET', url)).json(); }
  catch (e) {
    if (e.code !== 'NOTFOUND') throw e;
    // Is the file missing, or is the repository unreachable with this key?
    try { await gh('GET', API); } catch (e2) {
      if (e2.code === 'NOTFOUND') throw ghErr(T().keyBad, { code: 'KEY', detail: `Repository ${GH.owner}/${GH.repo} not found for this key.` });
      throw e2;
    }
    return { file: null, sha: null };
  }
  const text = meta.content ? b64decode(meta.content)
             : await (await gh('GET', url, null, 'application/vnd.github.raw+json')).text();   // files over 1 MB
  return { file: JSON.parse(text), sha: meta.sha };
}
async function ghWrite(file, sha, message, path = GH.path) {
  const body = { message, branch: GH.branch, content: b64encode(JSON.stringify(file, null, 1)) };
  if (sha) body.sha = sha;
  return (await (await gh('PUT', `${API}/contents/${path}`, body)).json()).content.sha;
}

const r2 = x => Math.round(x * 100) / 100;
// Same rules as the sheet formulas, so the worker sees the result straight away
function recompute(s) {
  S.order.forEach(k => {
    const t = s.tests[k], w = t.w;
    let done = 0; while (done < 3 && isNum(w[done])) done++;
    if (done === 3) {
      if (k === 'ASH') t.pct = r2((w[2] - w[0]) / (w[1] - w[0]) * 100);
      else if (k === 'VM') {
        const mc = s.tests.MC && s.tests.MC.pct;
        t.pct = isNum(mc) ? r2((w[1] - w[2]) / (w[1] - w[0]) * 100 - mc) : null;
      } else t.pct = r2((w[1] - w[2]) / (w[1] - w[0]) * 100);
    }
    // Dry basis for VM and Ash, which their upper limits use
    const mcDb = s.tests.MC && s.tests.MC.pct;
    t.db = (k === 'VM' || k === 'ASH') && isNum(t.pct) && isNum(mcDb) && mcDb < 100 ? r2(t.pct / (100 - mcDb) * 100) : null;
    t.done = isNum(t.pct) ? 3 : done;
    t.required = !S.tests[k].optional || s.tmRequired;

  const vmDb = s.tests.VM && s.tests.VM.db, ashDb = s.tests.ASH && s.tests.ASH.db;
  s.fcSt = isNum(vmDb) && isNum(ashDb) ? { pct: r2(100 - vmDb - ashDb), db: r2(100 - vmDb - ashDb), done: 3, required: true } : null;
  const req = S.order.filter(k => s.tests[k].required);
  s.status = req.every(k => isNum(s.tests[k].pct) || (k === 'VM' && s.tests[k].done === 3)) ? 'Complete'
           : S.order.some(k => s.tests[k].done > 0) ? 'In progress' : 'Pending';
}
function enqueue(job) {

  job.at = Date.now();

  if (job.action === 'resetTest')
    Q = Q.filter(j => !(j.action === 'saveWeight' && j.code === job.code && j.key === job.key));
  if (job.action === 'saveWeight' || job.action === 'setTmRequired')
    Q = Q.filter(j => !(j.action === job.action && j.code === job.code && j.key === job.key && j.step === job.step));

function commitMessage(batch) {

             : first.action === 'resetTest' ? `${first.code} ${TESTS[first.key].label} reset`
             : first.action === 'photo' ? `${first.code} ${TESTS[first.rec.test].label} photo${first.rec.skipped ? ' skipped' : ''}`
             : first.action === 'addCodes' ? `add ${first.codes.length} code(s)`
             : first.action === 'importRows' ? `import ${first.rows.length} row(s)` : `${first.action} ${first.code || ''}`;

async function sync() {

  try {
    for (let attempt = 0; ; attempt++) {
      let { file, sha } = await ghRead();
      if (isStale(sha) && S.file && S.fileSha) { file = JSON.parse(JSON.stringify(S.file)); sha = S.fileSha; }   // our own newer copy
      const f = file || emptyFile();
      batch.forEach(j => { j.lost = lostOf(f, j); fileApply(f, j); });   // note what each change replaces, as GitHub has it
      try { const next = await ghWrite(f, sha, commitMessage(batch)); markOld(sha); takeFile(f, next); wroteAt = Date.now(); break; }
      catch (e) { if (e.code !== 'CONFLICT' || attempt >= 4) throw e; }   // another phone saved first: read again
    }

    QT.push(...batch.filter(j => TS_ACTIONS.includes(j.action))); saveQT(); syncTs();

function showSync() {

      : S.syncErr && S.syncErr.code === 'KEY' ? '⚠ ' + t.keyBad

    if (rg) return overMax(rg[0], d) ? `<span class="ind low">${esc(t.sampleW(fmt(d)))} (${rg[0].toFixed(3)} – ${rg[1].toFixed(3)})</span>`
      : `<span class="ind ok">${esc(t.sampleW(fmt(d)))} ✓</span>`;
    if (!cfg.targetSample) return esc(t.sampleW(fmt(d)));
    return d < cfg.targetSample
      ? `<span class="ind low">${esc(t.sampleW(fmt(d)))}</span>`
      : `<span class="ind ok">${esc(t.sampleW(fmt(d)))} ✓</span>`;
  }
  if (S.step === 3 && isNum(w[0]) && isNum(w[1])) {
    if (v > w[1]) return warn(t.heavier(fmt(w[1])));
    if (v < w[0]) return warn(t.lighter(ves(k), fmt(w[0])));
    const sw = w[1] - w[0];
    if (k === 'ASH') return esc(t.ashLeft(fmt(v - w[0]), ((v - w[0]) / sw * 100).toFixed(2)));
    const lost = t.lost(fmt(w[1] - v));
    return esc(k === 'VM' ? lost : `${lost} (${((w[1] - v) / sw * 100).toFixed(2)} %)`);
  }

}

function parseCodes(txt) {

      if (b - a > 500 || b < a) return;

/* ---- tiny .xlsx writer (no library needed): red cells for flagged results ---- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files) {   // files: [{name, text}] — stored, not compressed
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);
    c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  });
  const size = cen.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function parseCSV(text) {
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; } else cell += c; }
    else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

    case 'toggle-done': S.showDone = !S.showDone; render(); break;
    case 'open-sample':
      rememberCard(`.sample[data-code="${CSS.escape(el.dataset.code)}"]`);
      S.code = el.dataset.code; S.view = 'sample'; render(); break;
    case 'open-final':
      rememberCard(`.testbtn[data-code="${CSS.escape(el.dataset.code)}"][data-test="${CSS.escape(el.dataset.test)}"]`);
      S.code = el.dataset.code; openTest(el.dataset.test); break;
    case 'open-test': openTest(el.dataset.test); break;
    case 'card': goCard(el.dataset.dir); break;
    case 'home': S.view = 'home'; render(); S.restoreOnce = true; load(false); break;
    case 'back-sample':
      S.via = null; S.walk = null;
      S.view = 'sample'; S.modal = null; render(); break;
    case 'tm': setTm(el.dataset.val === '1'); break;
    case 'approve': {
      if (!el.dataset.armed) { el.dataset.armed = '1'; el.textContent = T().apprTap; setTimeout(() => { delete el.dataset.armed; el.textContent = T().apprBtn; }, 4000); break; }
      setApproval(sample(S.code), true); break;
    }
    case 'unapprove': if (confirmTap(el)) setApproval(sample(S.code), false); break;
    case 'edit': {
      S.step = Number(el.dataset.step); S.editing = true; S.view = 'step';
      const w = sample(S.code).tests[S.test].w[S.step - 1];
      S.draft = isNum(w) ? String(w) : ''; render(); break;
    }
    case 'save': askConfirm(); break;
    case 'cancel': S.modal = null; render(); break;
    case 'ask-reset': S.modal = { type: 'reset', key: el.dataset.test }; render(); break;
    case 'do-reset': {
      const key = S.modal.key; S.modal = null;
      enqueue({ action: 'resetTest', code: S.code, key, worker: S.worker });
      S.view = 'sample'; render();
      toast(T().resetDone(S.code, lbl(key)), true);
      break;
    }
    case 'confirm': doSave(); break;
    case 'who-list': S.view = 'who'; render(); break;
    case 'super':
      if (el.dataset.val !== '1') { store.set('super', '0'); render(); break; }
      askPin().then(ok => { if (ok) { store.set('super', '1'); store.set('superAt', String(Date.now())); } render(); });
      break;
    case 'pin-change': if (superOn()) newPin(); break;
    case 'worker-add': {
      const name = (document.getElementById('wname').value || '').trim(), sym = document.getElementById('wsym').value;
      if (!name || !sym) { toast('Type a name first.'); break; }
      enqueue({ action: 'setWorkers', workers: (settings().workers || []).filter(w => w.name !== name).concat([{ name, sym }]), worker: S.worker });
      render(); break;
    }
    case 'worker-del': if (confirmTap(el)) { const ws = (settings().workers || []).slice(); ws.splice(+el.dataset.i, 1); enqueue({ action: 'setWorkers', workers: ws, worker: S.worker }); render(); } break;
    case 'save-limits': {
      const lim = {}, num = id => { const v = document.getElementById(id).value.trim(); return v === '' || !isFinite(+v) ? null : +v; };
      ['MC', 'VM', 'ASH', 'FC'].forEach(k => { lim[k] = [num('lmin-' + k), num('lmax-' + k)]; });
      enqueue({ action: 'setLimits', limits: lim, worker: S.worker }); toast('Saved.', true); render(); break;
    }
    case 'save-range': {
      const range = {};
      ['MC', 'VM', 'ASH', 'TM'].forEach(k => { const a = parseFloat(document.getElementById('rmin-' + k).value), b = parseFloat(document.getElementById('rmax-' + k).value);
        range[k] = b > 0 && !(a > b) ? [a > 0 ? a : 0, b] : null; });
      enqueue({ action: 'setRange', range, worker: S.worker }); toast('Saved.', true); render(); break;
    }
    case 'save-mins': {
      const mins = {}; ['MC', 'VM', 'ASH'].forEach(k => { const v = +document.getElementById('mins-' + k).value; if (v > 0) mins[k] = v; });
      enqueue({ action: 'setMins', mins, worker: S.worker });
      const temp = {}; ['MC', 'VM', 'ASH'].forEach(k => { const v = +document.getElementById('temp-' + k).value; temp[k] = v > 0 ? v : null; });
      enqueue({ action: 'setTemp', temp, worker: S.worker }); toast('Saved.', true); render(); break;
    }
    case 'after': afterSaved(); render(); break;
    case 'photo-take': {
      S.photoFor = { code: S.code, test: el.dataset.test || S.test };
      const inp = document.getElementById('photofile'); inp.value = ''; inp.click(); break;
    }
    case 'photo-skip': skipPhoto(); afterSaved(); render(); break;
    case 'photo-view': viewPhoto(el.dataset.path); break;
    case 'photo-close': {
      if (el.classList.contains('modal') && e.target !== el) break;   // a tap on the picture itself keeps it open
      if (S.modal && S.modal.url) URL.revokeObjectURL(S.modal.url);
      S.modal = null; render(); break;
    }
    case 'refresh': load(true); break;
    case 'setup': S.view = 'setup'; render(); break;
    case 'machine': S.machine = el.dataset.val || ''; store.set('machine', S.machine); render(); toast(S.machine ? `This phone is now ${S.machine}.` : 'Showing every sample.', true); break;
    case 'setup-done': S.view = S.worker ? 'home' : 'name'; if (S.data) render(); else renderNotReady(); load(false); break;
    case 'save-key': saveKey(); break;
    case 'forget-key': if (confirmTap(el)) { KEY = ''; store.set('ghkey', ''); S.syncErr = null; render(); showSync(); } break;
    case 'add-codes': addCodes(); break;
    case 'remove-code': if (confirmTap(el)) { enqueue({ action: 'removeCode', code: el.dataset.code, worker: S.worker }); render(); } break;
    case 'export': exportCSV(); break;
    case 'export-xlsx': exportXLSX(); break;
    case 'run-results': runResults(el); break;
    case 'load-log': loadLog(); break;
    case 'restore-log': restoreLog(el); break;
    case 'import': document.getElementById('csvfile').click(); break;
    case 'name': S.view = (settings().workers || []).length ? 'who' : 'name'; render(); break;
    case 'save-name': saveName(); break;
  }
});

document.addEventListener('input', e => {
  if (loadInput(e.target)) return;
  if (e.target.id === 'w') {
    // the balance reads 0.0001 g: a 5th decimal is a typing slip, so it is not taken
    const m = e.target.value.match(/^(\d*[.,]\d{4})\d+/);
    if (m) { e.target.value = m[1]; bad(); }
    S.draft = e.target.value;
    document.getElementById('live').innerHTML = liveText();
  } else if (e.target.dataset.input === 'logq') {
    S.logQuery = e.target.value;
    const box = document.createElement('div'); box.innerHTML = logHTML();
    document.getElementById('loglist').replaceWith(box.querySelector('#loglist'));
  } else if (e.target.dataset.input === 'query') {
    S.query = e.target.value;
    document.getElementById('list').innerHTML = listHTML();
  }
});

// Swipe left for the next sample, right for the previous one (sample screen only, never on a weight screen)
let swipe = null;
document.addEventListener('touchstart', e => {
  const p = e.touches[0];
  // one finger, not from the very edge (Android's back gesture starts there)
  swipe = (S.view === 'sample' && !S.modal && e.touches.length === 1 && p.clientX > 24 && p.clientX < window.innerWidth - 24)
    ? { x: p.clientX, y: p.clientY, t: Date.now() } : null;
}, { passive: true });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) swipe = null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!swipe) return;
  const p = e.changedTouches[0], dx = p.clientX - swipe.x, dy = p.clientY - swipe.y, quick = Date.now() - swipe.t < 800;
  swipe = null;
  if (quick && Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) goCard(dx < 0 ? 'next' : 'prev');
}, { passive: true });
document.addEventListener('touchcancel', () => { swipe = null; });
app.addEventListener('animationend', () => app.classList.remove('slide-next', 'slide-prev', 'bump-next', 'bump-prev'));

document.addEventListener('keydown', e => {
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && S.view === 'sample' && !e.target.closest('input, textarea'))
    { goCard(e.key === 'ArrowRight' ? 'next' : 'prev'); return; }
  if (e.key !== 'Enter' || S.busy) return;
  if (e.target.id === 'w') askConfirm();
  else if (e.target.id === 'nm') saveName();
  else if (e.target.id === 'typecode') { if (e.target.value.trim()) onScan(e.target.value.trim(), 'any'); }
  else if (e.target.id === 'scantype') scanTyped();
  else if (e.target.id === 'newcodes') addCodes();
  else if (e.target.id === 'key') saveKey();
});

/* ---------- progressive web app ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  if (!S.modal && S.view !== 'step') render();
});
window.addEventListener('appinstalled', () => { installEvt = null; if (!S.modal) render(); });
// Refresh the sample list when the app comes back to the screen or the network returns
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.view === 'home' && !S.modal && !S.busy && S.data) load(false);
});
window.addEventListener('online', () => { syncFails = 0; sync(); uploadPhotos(); });
window.addEventListener('online', () => { if (S.view === 'home' && !S.busy && S.worker) load(false); });
// Pick up other phones' work every minute while the list is on screen
setInterval(() => {
  if (document.visibilityState === 'visible' && S.view === 'home' && !S.modal && !S.busy) load(false);
}, 60000);

// Batch countdowns: redraw the batch screens while nobody is typing
setInterval(() => {
  const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (document.visibilityState === 'visible' && S.data && (S.view === 'home' || S.view === 'run' || S.view === 'sample') && !S.modal && !S.busy && !SCAN && !typing) render();
}, 20000);

// One-time setup link: #key=...  (saved on this phone, then removed from the address bar)
(function takeKeyFromLink() {
  const m = location.hash.match(/key=([^&]+)/);
  if (m) {
    KEY = decodeURIComponent(m[1]).trim(); store.set('ghkey', KEY);
    history.replaceState(null, '', location.pathname + location.search);
    setTimeout(() => toast('This phone is now connected.', true), 300);
  }
})();
S.tests = TESTS; S.order = ORDER;
S.file = readJSON('file', null); S.fileSha = store.get('fileSha');
setTimeout(syncTs, 1500); setTimeout(syncLog, 2500); setTimeout(uploadPhotos, 3500);
if (S.file && S.file.codes) rebuild();
if (S.worker) { if (S.data) render(); else renderNotReady(); load(); sync(); } else { render(); load(); }
showSync();

// The phone's back button goes back one step inside the app instead of closing it:
// one extra history entry is kept, and each back press does what the screen's own back does.
function goBack() {
  if (SCAN) { closeScanner(); return; }
  if (S.modal) {
    const b = app.querySelector('.modal [data-act=red-ok], .modal [data-act=red-again], .modal [data-act=after], .modal [data-act=cancel]');
    if (b) b.click(); else { S.modal = null; render(); }
    return;
  }
  if (S.view === 'home' || S.view === 'who' && !S.worker) return;          // first screen: stay in the app
  const b = app.querySelector('header.tbar .iconbtn');
  if (b && (S.view === 'step' || S.view === 'sample' || S.view === 'run' || S.view === 'load')) { b.click(); return; }
  S.view = 'home'; render();
}
try { history.pushState({ app: 1 }, ''); } catch (e) {}
window.addEventListener('popstate', () => { goBack(); try { history.pushState({ app: 1 }, ''); } catch (e) {} });
</script>
